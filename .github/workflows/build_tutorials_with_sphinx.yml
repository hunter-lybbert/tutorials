name: Deploy Tutorials Book to Pages

on:
  push:
    branches: ["main"] # Update if your default branch is different
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Ensures full history if needed by extensions like git-stamp or last-modified

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          # Ensure core Sphinx and notebook execution/rendering packages are installed
          pip install sphinx sphinx-book-theme myst-nb

      - name: Build Sphinx documentation
        run: |
          # If conf.py is at the root:
          sphinx-build -b html . _build/html
          # Note: If your source files are inside a 'docs/' folder instead, change '.' to 'docs'

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _build/html

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
