name: Build and Deploy Notebook Tutorials

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build-docs:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install nbconvert

      - name: Convert notebooks to HTML
        run: |
          find . -mindepth 2 -name "*.ipynb" -type f | while read notebook; do
            dir=$(dirname "$notebook")

            echo "Converting $notebook"

            jupyter nbconvert \
              --to html \
              "$notebook" \
              --output-dir "$dir" \
              --output index.html
          done

      - name: Commit and push generated HTML
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add '*/index.html'
          git commit -m "Update rendered tutorials" || echo "No changes to commit"
          git push
